<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>知识库 AI Agent</title>
<style>
  :root{ --navy:#15233B; --teal:#0E8388; --tealD:#0B6A6A; --cloud:#EAF2F4; --ink:#1E293B; --slate:#64748B; --line:#E5EBEC; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif; color:var(--ink); font-size:13px; background:#F4F7F8; }
  button{ font-family:inherit; cursor:pointer; }
  textarea,input,select{ font-family:inherit; }
  .app{ display:flex; height:100vh; }
  .sidebar{ width:224px; flex-shrink:0; background:var(--navy); display:flex; flex-direction:column; }
  .brand{ padding:18px 20px; display:flex; align-items:center; gap:8px; border-bottom:1px solid rgba(255,255,255,.08); }
  .brand .logo{ width:32px; height:32px; border-radius:8px; background:var(--teal); display:flex; align-items:center; justify-content:center; color:#fff; }
  .brand .t1{ color:#fff; font-weight:700; font-size:14px; }
  .brand .t2{ color:#8FB3B3; font-size:10px; }
  .nav{ flex:1; padding:14px 12px; display:flex; flex-direction:column; gap:4px; overflow:auto; }
  .nav button{ display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:8px; border:none; background:transparent; color:#C3D0D0; font-size:14px; text-align:left; }
  .nav button.active{ background:var(--teal); color:#fff; }
  .uinfo{ padding:14px 12px; border-top:1px solid rgba(255,255,255,.08); }
  .uinfo .lic{ font-size:10px; color:#8FB3B3; margin:0 4px 8px; line-height:1.5; }
  .uinfo .lic b{ color:#CFE0E0; }
  .ubar{ display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px; background:#1E3050; }
  .ubar .av{ width:26px; height:26px; border-radius:50%; background:var(--teal); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .ubar .nm{ color:#fff; font-size:12px; line-height:1.3; flex:1; min-width:0; }
  .ubar .nm small{ color:#8FB3B3; }
  .ubar .lo{ background:none; border:none; color:#8FB3B3; }
  .main{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .header{ display:flex; align-items:center; justify-content:space-between; padding:16px 28px; background:#fff; border-bottom:1px solid var(--line); }
  .header .h1{ font-weight:700; font-size:16px; color:var(--navy); }
  .header .h2{ font-size:12px; color:var(--slate); }
  .badge{ display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px; font-size:11px; font-weight:600; background:var(--cloud); color:var(--tealD); }
  .warn{ padding:8px 28px; font-size:12px; background:#FFF4E0; color:#8A5A00; }
  .err{ padding:8px 28px; font-size:12px; background:#FDECEC; color:#A23B3B; }
  .content{ flex:1; overflow:auto; }
  .pad{ padding:24px 28px; }
  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:24px; }
  .grid4{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:20px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px; }
  .stat .l{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--slate); margin-bottom:8px; }
  .stat .v{ font-weight:700; color:var(--navy); }
  .sectitle{ font-weight:700; font-size:14px; color:var(--navy); }
  .muted{ color:var(--slate); }
  .sq{ text-align:left; width:100%; padding:12px 16px; border-radius:8px; background:#F7FAFA; border:1px solid var(--line); color:var(--ink); display:flex; align-items:center; justify-content:space-between; font-size:14px; margin-top:8px; }
  .sq .l{ display:flex; align-items:center; gap:8px; }
  .tag{ padding:2px 6px; border-radius:5px; font-size:10px; background:var(--cloud); color:var(--tealD); }
  .tag.red{ background:#FDECEC; color:#A23B3B; }
  .doc{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; }
  .doc .top{ display:flex; align-items:flex-start; justify-content:space-between; }
  .doc .title{ display:flex; align-items:center; gap:8px; font-weight:500; font-size:14px; color:var(--navy); flex-wrap:wrap; }
  .talent-row{ transition:box-shadow .14s ease, border-color .14s ease, background .14s ease; }
  .talent-row:hover{ box-shadow:0 2px 10px rgba(14,131,136,.08); border-color:var(--teal); background:#FAFDFD; }
  @media (prefers-reduced-motion: reduce){ .talent-row{ transition:none; } }
  .rowchips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .rowchips .tag{ font-size:11px; padding:2px 9px; background:#F2F7F7; color:var(--slate); }
  .form{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .form input,.form select,.form textarea{ padding:8px 12px; border-radius:8px; border:1px solid #D6E0E1; font-size:14px; outline:none; }
  .form textarea{ resize:none; }
  .btn{ display:flex; align-items:center; justify-content:center; gap:6px; padding:8px; border-radius:8px; font-size:14px; font-weight:500; border:none; }
  .btn-primary{ background:var(--teal); color:#fff; }
  .btn-primary:disabled{ background:#9DBDBD; }
  .btn-ghost{ background:#fff; border:1px solid #D6E0E1; color:var(--tealD); }
  .iconbtn{ background:none; border:none; color:#B9434B; }
  .chat{ display:flex; flex-direction:column; height:100%; }
  .msgs{ flex:1; overflow:auto; padding:24px 28px; }
  .empty{ height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .empty .ic{ width:56px; height:56px; border-radius:16px; background:var(--teal); color:#fff; display:flex; align-items:center; justify-content:center; margin-bottom:16px; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:520px; margin-top:20px; }
  .chip{ padding:6px 12px; border-radius:999px; font-size:12px; background:#fff; border:1px solid #DCE6E7; color:var(--tealD); }
  .row-user{ display:flex; justify-content:flex-end; margin-bottom:20px; }
  .bub-user{ max-width:78%; background:var(--teal); color:#fff; border-radius:16px; border-top-right-radius:4px; padding:10px 16px; font-size:14px; white-space:pre-wrap; }
  .row-ai{ display:flex; gap:12px; margin-bottom:20px; }

  .src .h .l{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .src .num{ display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:4px; font-size:10px; font-weight:700; background:var(--teal); color:#fff; }
  .src .body{ padding:8px 12px; font-size:12px; line-height:1.6; }
  .fb{ display:flex; align-items:center; gap:8px; margin-top:6px; font-size:12px; color:var(--slate); }
  .fb button{ background:none; border:none; font-size:14px; }
  .loadbub{ display:flex; align-items:center; gap:8px; background:#fff; border:1px solid #E2E8E9; border-radius:16px; border-top-left-radius:4px; padding:12px 16px; font-size:14px; color:var(--slate); }
  .spin{ width:14px; height:14px; border:2px solid #cbd5d8; border-top-color:var(--teal); border-radius:50%; animation:spin .9s linear infinite; display:inline-block; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  /* 阶段D 统一长文展开(ExpandableText) */
  .exbody{ white-space:pre-wrap; font-size:12px; line-height:1.7; background:#F7FAFA; border:1px solid var(--line); border-radius:8px; padding:12px; position:relative; overflow:hidden; }
  .exbody.clip{ max-height:var(--exh,160px); }
  .exbody.clip::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:34px; background:linear-gradient(rgba(247,250,250,0), #F7FAFA); }
  @media (prefers-reduced-motion: no-preference){ .exbody{ transition:max-height .15s ease; } }
  /* 阶段D 危险操作二次确认弹窗 */
  .dlg-ov{ position:fixed; inset:0; background:rgba(20,32,38,.45); display:flex; align-items:center; justify-content:center; z-index:1000; }
  .dlg{ background:#fff; border-radius:14px; padding:20px 22px; width:min(88vw,384px); box-shadow:0 14px 44px rgba(0,0,0,.28); }
  .dlg-msg{ font-size:14px; color:var(--slate); line-height:1.65; margin-bottom:18px; }
  .dlg-act{ display:flex; gap:10px; justify-content:flex-end; }
  .chatinput{ padding:16px 28px; background:#fff; border-top:1px solid var(--line); }
  .modelbar{ display:flex; align-items:center; gap:8px; margin-bottom:10px; font-size:12px; color:var(--slate); }
  .modelbar select{ padding:5px 10px; border-radius:8px; border:1px solid #D6E0E1; font-size:13px; color:var(--navy); background:#fff; outline:none; }
  .modelhint{ font-size:11px; color:#9AA7B2; }
  .modeltag{ display:inline-flex; align-items:center; gap:4px; font-size:11px; color:var(--tealD); background:var(--cloud); padding:2px 8px; border-radius:999px; margin-top:8px; }
  .inbox{ display:flex; align-items:flex-end; gap:8px; border:1px solid #D6E0E1; border-radius:12px; padding:8px 12px; }
  .inbox textarea{ flex:1; border:none; outline:none; resize:none; background:transparent; font-size:14px; padding:4px 0; max-height:96px; }
  .sendbtn{ flex-shrink:0; width:36px; height:36px; border-radius:8px; border:none; background:var(--teal); color:#fff; display:flex; align-items:center; justify-content:center; }
  .sendbtn:disabled{ background:#9DBDBD; }
  .searchbar{ display:flex; gap:8px; max-width:640px; margin-bottom:20px; }
  .searchbar input{ flex:1; padding:10px 16px; border-radius:8px; border:1px solid #D6E0E1; font-size:14px; outline:none; background:#fff; }
  .hit{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:8px; max-width:640px; }
  .hit .h{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--navy); margin-bottom:6px; }
  mark{ background:#FFE9A8; padding:0 1px; }
  .empty-box{ font-size:12px; color:var(--slate); padding:32px 16px; text-align:center; border-radius:12px; background:#fff; border:1px dashed #D6E0E1; }
  /* table */
  table.ut{ width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  table.ut th,table.ut td{ text-align:left; padding:10px 14px; font-size:13px; border-bottom:1px solid var(--line); }
  table.ut th{ background:#F7FAFA; color:var(--slate); font-weight:600; font-size:12px; }
  /* bar chart */
  .barchart{ display:flex; align-items:flex-end; gap:5px; height:150px; padding-top:8px; }
  .bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; height:100%; justify-content:flex-end; }
  .bar{ width:70%; background:var(--teal); border-radius:3px 3px 0 0; min-height:2px; }
  .bar-x{ font-size:9px; color:var(--slate); margin-top:4px; }
  /* finance workbench */
  .fw .r{ margin-bottom:8px; }
  .fw .g{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
  .fw .g3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:8px; }
  .fw label{ font-size:12px; color:var(--slate); display:block; margin-bottom:3px; }
  .fw input{ width:100%; padding:8px 10px; border-radius:8px; border:1px solid #D6E0E1; font-size:14px; outline:none; }
  .kv{ display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .kv b{ color:var(--navy); }
  .kv.total{ border-bottom:none; margin-top:6px; padding-top:8px; border-top:2px solid var(--cloud); font-size:15px; }
  /* login */
  .login-wrap{ height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#15233B,#0E8388); }
  .login{ background:#fff; border-radius:16px; padding:32px; width:360px; box-shadow:0 20px 50px rgba(0,0,0,.25); }
  .login .lg{ width:48px; height:48px; border-radius:12px; background:var(--teal); color:#fff; display:flex; align-items:center; justify-content:center; margin-bottom:14px; }
  .login h1{ font-size:20px; color:var(--navy); margin:0 0 2px; }
  .login p.sub{ font-size:12px; color:var(--slate); margin:0 0 20px; }
  .login label{ font-size:12px; color:var(--slate); display:block; margin:12px 0 5px; }
  .login input{ width:100%; padding:10px 12px; border-radius:8px; border:1px solid #D6E0E1; font-size:14px; outline:none; }
  .login .lbtn{ width:100%; margin-top:20px; padding:11px; border-radius:8px; border:none; background:var(--teal); color:#fff; font-size:15px; font-weight:600; }
  .login .lbtn:disabled{ background:#9DBDBD; }
  .login .demo{ margin-top:18px; padding:10px 12px; border-radius:8px; background:#F4F7F8; font-size:11px; color:var(--slate); line-height:1.7; }
  .login .lerr{ margin-top:12px; font-size:12px; color:#A23B3B; min-height:14px; }
  ::-webkit-scrollbar{ width:8px; height:8px; } ::-webkit-scrollbar-thumb{ background:#cbd5d8; border-radius:8px; }
</style>
</head>

<script>
"use strict";
var DEPTS=["全员","人事","财务","技术","销售"];

function S(inner,sz){ sz=sz||18; return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+inner+'</svg>'; }
var IC={

};
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

var token = localStorage.getItem("kb_token") || "";
var state={ view:"home", user:null, license:null, roleNames:{}, userDepts:null, docs:[], stats:{documents:0,chunks:0},
  messages:[], convId:null, loading:false, search:null, err:"", expanded:{}, busy:false, pending:{}, phase:{}, users:null, analytics:null,
  models:[], modelId:"", chatPrefill:"",
  talentRows:[], talentStatuses:["草稿","待筛","约面","已面","评估","offer","淘汰"],
  talentFilters:{status:"",min_years:"",skill:"",education:""}, talentSelected:null, talentConfirm:null,
  talentCompare:[], talentBusy:false, talentMsg:"", jdGap:null, evaluation:null, commDraft:null, interviewQs:null,
  jobs:[], jobBusy:false, jobMsg:"", jdJobId:"", rubricJobId:"", rubricDraft:null, rubricBusy:false, rubricMsg:"", jobQueueId:"", jobQueue:null, matrixJobId:"", matrix:null,
  selectedJobId:"", jobTab:"overview", hiringFocus:"", capabilityPool:null,
  sendForm:false, sendBatch:null, sendBusy:false };
// LLM 动作统一在途守卫:同键进行中忽略后续点击(防重),状态驱动载入态扛重渲染。
function pend(k){ return !!(state.pending&&state.pending[k]); }
// 阶段B 分阶段载入文案:评分/拆解按阶段切词(状态驱动,扛重渲染);尊重 prefers-reduced-motion。
var LLM_STAGES={ eval:["取证中","计分中"], aidraft:["理解 JD","生成候选"] };
var REDUCE_MOTION=!!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);
var STAGE_MS=4000; // 单次调用约 5–30s,~4s 后从阶段0推进到阶段1
function stageLabel(k){ var s=LLM_STAGES[String(k).split(":")[0]]; if(!s) return null; var i=(state.phase&&state.phase[k])||0; return s[Math.min(i,s.length-1)]; }
function loadLabel(k,fallback){ return '<span class="spin"></span> '+esc(stageLabel(k)||fallback)+'…'; }
// reduced-motion:不切词,停在阶段0(静态首阶段文案)。
function scheduleStages(k){ var s=LLM_STAGES[String(k).split(":")[0]]; if(!s||REDUCE_MOTION) return []; var ids=[]; for(var i=1;i<s.length;i++){ (function(idx){ ids.push(setTimeout(function(){ if(state.phase&&state.pending&&state.pending[k]){ state.phase[k]=idx; paintTalent(); } }, idx*STAGE_MS)); })(i); } return ids; }
async function runLLM(k, fn){
  if(!state.pending) state.pending={};
  if(state.pending[k]) return;
  state.pending[k]=true; if(!state.phase) state.phase={}; state.phase[k]=0;
  var timers=scheduleStages(k); paintTalent();
  try{ await fn(); }
  catch(e){ state.err=e.message; renderShell(); }
  finally{ timers.forEach(clearTimeout); delete state.pending[k]; if(state.phase) delete state.phase[k]; paintTalent(); }
}

// 阶段D 统一长文展开:折叠到 collapsedPx,超出才给「展开全文/收起」;状态存 state.expanded[key](paintTalent 重渲染保持)。
function expandable(key, text, collapsedPx){
  var t=String(text==null?"":text), cp=collapsedPx||160;
  // 短文不夹(约按折叠高度折算字符量,免出现点了没反应的空展开按钮)。

  return '<div class="exbody'+(open?'':' clip')+'" style="--exh:'+cp+'px">'+esc(t)+'</div>'
    +'<button class="btn btn-ghost" data-extoggle="'+esc(key)+'" style="width:auto;padding:2px 10px;font-size:12px;margin-top:6px">'+(open?'收起':'展开全文')+'</button>';

// 阶段D 危险操作二次确认:统一样式弹窗替代原生 confirm;点遮罩/取消/Esc 关闭,确认才执行 onOk。
function confirmDanger(msg, onOk){
  var ov=document.createElement("div"); ov.className="dlg-ov";
  ov.innerHTML='<div class="dlg" role="alertdialog" aria-modal="true"><div class="dlg-msg">'+esc(msg)+'</div>'
    +'<div class="dlg-act"><button class="btn btn-ghost" data-dlg="no" style="width:auto;padding:7px 16px">取消</button>'
    +'<button class="btn" data-dlg="yes" style="width:auto;padding:7px 16px;background:#A23B3B;color:#fff;border-color:#A23B3B">确认</button></div></div>';
  function close(){ ov.remove(); document.removeEventListener("keydown", onKey); }
  function onKey(e){ if(e.key==="Escape") close(); }
  ov.addEventListener("click", function(e){ if(e.target===ov || e.target.getAttribute("data-dlg")==="no") close(); });
  ov.querySelector('[data-dlg="yes"]').addEventListener("click", function(){ close(); onOk(); });
  document.addEventListener("keydown", onKey);
  document.body.appendChild(ov);
}

async function api(path,opts){
  opts=opts||{}; opts.headers=Object.assign({}, opts.headers||{}, token?{Authorization:"Bearer "+token}:{});
  var r=await fetch(path,opts);
  if(r.status===401){ doLogout(true); throw new Error("401"); }
  if(!r.ok){ var msg="HTTP "+r.status; try{ var j=await r.json(); if(j.detail) msg=j.detail; }catch(e){} throw new Error(msg); }
  return await r.json();
}

function fmtTool(res){

  if(Array.isArray(res.明细)){  // prefill_claim:报销单明细

async function loadEvidenceMatrix(){

    if(pairs.some(function(p){return p[1].is_current===false;})){ state.matrix={error:"至少一名候选人的简历或评分规则版本已变更，历史评分不能进入当前矩阵。请先逐人重新评分。"}; paintTalent(); return; }
    var byCandidate={}; pairs.forEach(function(p){byCandidate[p[0]]=p[1];});

  var head=i.status==="failed"?'<span class="tag" style="background:#FDECEC;color:#A23B3B">失败</span>':'<span class="tag">'+esc(i.status)+'</span>';

        provRow("收件人", esc(i.to_name)+" 〈"+esc(i.to_email)+"〉 <span class='tag'>代码绑定</span>", "姓名与邮箱由系统从候选人档案机械填充,AI 无权改动——从结构上杜绝错发")
        +provRow("发送", esc(i.sent_at?new Date(i.sent_at*1000).toLocaleString():"未发出"), "随批次经 HR 一次确认后发出;建批/确认/发送均已落审计表")
        +(i.status==="failed"?provRow("失败原因", esc(i.fail_reason||""), "SMTP 返回的原始错误;可在批报告用「只重试失败的」重发"):""))
    +provSection("prov:"+i.id+":2","②","个性化句 · 规则选材",
        provRow("素材", esc(i.material_value||"(无)")+(i.material_value?' <span class="tag">白名单内</span>':""), "只能从该候选人已被 HR 确认过的评分维度里选,清单外一律拦下")
        +provRow("素材来源", srcTxt, "冻结评分规则的维度名(HR 权威、JD 蒸馏);候选人简历原文字节永不进邮件")
        +provRow("选材依据", wordTxt, "一行确定性规则:证据等级×权重最高的一条,无模型参与、每次结果相同"))
    +provSection("prov:"+i.id+":3","③","机检与模板",
        provRow("机检", okN+"/"+chkN+" 通过", "收件人绑定/状态门/邮箱/防重/素材白名单/受保护属性/决策词——全部确定性代码检查")
        +provRow("模板", esc(i.template_version||""), "骨架文字与称呼/岗位/时间/地点槽位均为代码填充;模板改动需重新人工审定"))
    +'<div class="muted" style="font-size:11px;border-top:1px solid var(--line);padding-top:8px;margin-top:8px">本信全文零 AI 生成;个性化字段由上游评分管线制造,问答入口按 I1 恒不可查候选人数据</div></div>';
}
async function createSendBatch(){
  var ids=(state.compareSel||[]).slice(); if(!ids.length){ state.err="请先勾选候选人"; renderShell(); return; }
  state.sendBusy=true; paintTalent();
  try{
    var b=await api("/api/send-batches",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({mail_type:document.getElementById("sf_type").value, job_id:document.getElementById("sf_job").value,
        candidate_ids:ids, interview_time:document.getElementById("sf_time").value,
        location:document.getElementById("sf_loc").value, note:document.getElementById("sf_note").value})});
    state.sendBusy=false; state.sendForm=false; state.sendBatch=b; state.compareSel=[]; paintTalent();
  }catch(e){ state.sendBusy=false; state.err="建批失败:"+e.message; renderShell(); }
}
function confirmSendBatch(){
  var b=state.sendBatch; if(!b) return;
  var n=(b.items||[]).filter(function(i){return i.status==="pending";}).length;
  confirmDanger("确认发送 "+n+" 封?邮件发出后无法撤回。", async function(){
    try{ var r=await api("/api/send-batches/"+b.id+"/confirm",{method:"POST"}); state.sendBatch=r.batch||r; paintTalent(); }
    catch(e){ state.err="发送失败:"+e.message; renderShell(); }
  });
}
async function resolveSendItem(action, iid){
  try{ await api("/api/send-items/"+iid+"/resolve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:action})});
    var r=await api("/api/send-batches/"+state.sendBatch.id); state.sendBatch=r; paintTalent();
  }catch(e){ state.err="处置失败:"+e.message; renderShell(); }
}
async function exportSendCsv(id){
  try{
    var r=await fetch("/api/send-batches/"+id+"/export.csv",{headers:token?{Authorization:"Bearer "+token}:{}});
    if(!r.ok) throw new Error("HTTP "+r.status);
    var blob=await r.blob(), url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download="batch-"+String(id).slice(0,8)+".csv"; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    var b=await api("/api/send-batches/"+id); state.sendBatch=b; paintTalent();
  }catch(e){ state.err="导出失败:"+e.message; renderShell(); }
}
function toggleCompareSel(cid){
  if(!state.compareSel) state.compareSel=[];
  var i=state.compareSel.indexOf(cid);
  if(i>=0) state.compareSel.splice(i,1); else state.compareSel.push(cid);
  state.matrix=null;
  if(state.compareSel.length<2) state.showCompare=false;
  paintTalent();
}
async function openConfirm(cid){
  try{ var d=await api("/api/talent/"+cid);
    state.talentConfirm={id:d.id, fields:{name:d.name,phone:d.phone,email:d.email,education:d.education,years:d.years,skills:d.skills,expected_salary:d.expected_salary,experience:d.experience}, original_text:d.original_text||"", needs_review:false};
    state.talentMsg=""; paintTalent();
  }catch(e){ state.err=e.message; renderShell(); }
}
async function submitConfirm(cid){
  var v=function(id){ var el=document.getElementById(id); return el?el.value.trim():""; };
  var email=v("tf_email"), phone=v("tf_phone"), years=v("tf_years"), errEl=document.getElementById("tf_err");
  if(email && !TF_EMAIL.test(email)){ errEl.textContent="邮箱格式不合法,请核对原文修正。"; return; }
  if(phone && !TF_PHONE.test(phone)){ errEl.textContent="电话格式不合法,请核对原文修正。"; return; }
  if(years && (!/^\d+(\.\d+)?$/.test(years) || Number(years)<0)){ errEl.textContent="相关年限应为不小于 0 的数字。"; return; }
  var body={name:v("tf_name"), phone:phone, email:email, education:v("tf_edu"), years:years?Number(years):null,
            skills:v("tf_skills"), expected_salary:v("tf_salary"), experience:v("tf_experience")};
  var go=document.getElementById("tf_go"); if(go){ go.disabled=true; go.textContent="确认中…"; }
  try{ await api("/api/talent/"+cid+"/confirm",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    state.talentMsg="已确认入库,状态转「待筛」。"; await loadTalent();
    var q=state.reviewQ;
    if(q && q.i+1 < q.list.length){ q.i++; await openConfirm(q.list[q.i]); return; }  // 逐份快速过:自动跳下一份
    state.reviewQ=null; state.talentConfirm=null; paintTalent();
  }catch(e){ if(go){ go.disabled=false; go.textContent="确认入库(转「待筛」)"; } if(errEl) errEl.textContent="确认失败:"+e.message; }
}
async function updateTalentStatus(cid,status){
  var reason=window.prompt("请填写状态变更理由"); if(!reason||!reason.trim()) return;
  try{ await api("/api/talent/"+cid+"/status",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:status,reason:reason.trim()})});
    await loadTalent(); await openCandidate(cid);
  }catch(e){ state.err="状态更新失败:"+e.message; renderShell(); }
}
async function rowUpdateStatus(cid,status){
  var reason=window.prompt("请填写状态变更理由"); if(!reason||!reason.trim()) return;
  try{ await api("/api/talent/"+cid+"/status",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:status,reason:reason.trim()})});
    await loadTalent(); paintTalent();
  }catch(e){ state.err="状态更新失败:"+e.message; renderShell(); }
}
function toggleDraftSel(cid){
  if(!state.draftSel) state.draftSel=[];
  var i=state.draftSel.indexOf(cid);
  if(i>=0) state.draftSel.splice(i,1); else state.draftSel.push(cid);
  paintTalent();
}
function batchReject(){
  var ids=(state.draftSel||[]).slice(); if(!ids.length) return;
  confirmDanger("退回(删除)选中的 "+ids.length+" 份草稿?此操作不可撤销。", async function(){
    try{
      for(var i=0;i<ids.length;i++){ await api("/api/talent/"+ids[i],{method:"DELETE"}); }
      state.draftSel=[]; state.talentMsg="已退回 "+ids.length+" 份草稿。"; await loadTalent(); paintTalent();
    }catch(e){ state.err="退回失败:"+e.message; renderShell(); }
  });
}
function startReview(){
  var ids=(state.draftSel||[]).slice(); if(!ids.length) return;
  state.reviewQ={list:ids, i:0}; state.draftSel=[];
  openConfirm(ids[0]);
}
async function createJob(){
  var title=(document.getElementById("job_title").value||"").trim();
  var jd=(document.getElementById("job_jd").value||"").trim();
  if(!title){ state.jobMsg="请先填岗位名称"; paintTalent(); return; }
  state.jobBusy=true; state.jobMsg=""; paintTalent();
  try{ await api("/api/jobs",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:title,jd_text:jd})});
    state.jobBusy=false; state.jobMsg="已建岗位:"+title; await loadTalent(); paintTalent();
  }catch(e){ state.jobBusy=false; state.err="建岗位失败:"+e.message; renderShell(); }
}
function deleteJob(id){
  confirmDanger("删除该岗位?挂载关系一并清除(不影响候选人本身)。", async function(){
    try{ await api("/api/jobs/"+id,{method:"DELETE"}); if(state.jdJobId===id) state.jdJobId=""; await loadTalent(); paintTalent(); }
    catch(e){ state.err="删岗位失败:"+e.message; renderShell(); }
  });
}
async function updateJobStatus(id,status){
  try{ await api("/api/jobs/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:status})}); await loadTalent(); paintTalent(); }
  catch(e){ state.err="改岗位状态失败:"+e.message; renderShell(); }
}
async function attachCandidateToJob(jobId,cid){
  if(!jobId) return;
  try{ await api("/api/jobs/"+jobId+"/candidates",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({candidate_id:cid})}); await loadTalent(); paintTalent(); }
  catch(e){ state.err="挂到岗位失败:"+e.message; renderShell(); }
}
async function detachCandidateFromJob(jobId,cid){
  if(!jobId) return;
  try{ await api("/api/jobs/"+jobId+"/candidates/"+cid,{method:"DELETE"}); await loadTalent(); paintTalent(); }
  catch(e){ state.err="从岗位移除失败:"+e.message; renderShell(); }
}
async function runJdGap(cid){
  var jobId=state.jdJobId||"";
  var jd = jobId ? "" : ((document.getElementById("jd_text")||{}).value||"").trim();
  if(!jobId && !jd) return;   // 双入口:选岗位走 job_id、否则临时粘贴走 jd
  try{ var r=await api("/api/talent/"+cid+"/jd-gap",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(jobId?{job_id:jobId}:{jd:jd})});
    state.jdGap={id:cid, items:r.items||[], filtered:r.filtered||0, filtered_reasons:r.filtered_reasons||[], jd_flags:r.jd_flags||[]}; paintTalent();
  }catch(e){ var box=document.getElementById("jd_res"); if(box) box.innerHTML='<div class="err" style="padding:8px 12px;border-radius:8px">'+esc(e.message)+'</div>'; }
}
async function runCandidateEvaluation(cid){
  var jobId=state.jdJobId||""; if(!jobId) return;
  try{ var r=await api("/api/jobs/"+jobId+"/candidates/"+cid+"/evaluate",{method:"POST"}); r.candidate_id=cid; state.evaluation=r; paintTalent(); }
  catch(e){ var box=document.getElementById("jd_res"); if(box) box.innerHTML='<div class="err" style="padding:8px 12px;border-radius:8px">评分失败:'+esc(e.message)+'</div>'; }
}
async function runReview(cid){
  var btn=document.getElementById("rv_go"); if(btn){ btn.disabled=true; btn.textContent="体检中…"; }
  try{ var r=await api("/api/talent/"+cid+"/review",{method:"POST",headers:{"Content-Type":"application/json"}});
    r.id=cid; state.review=r; paintTalent();
  }catch(e){ if(btn){ btn.disabled=false; btn.textContent="运行简历体检"; } state.err="体检失败:"+e.message; renderShell(); }
}
async function runMessageDraft(cid,kind){
  var v=function(id){ var el=document.getElementById(id); return el?el.value.trim():""; };
  try{
    var r=await api("/api/talent/"+cid+"/message-draft",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({kind:kind,job_title:v("msg_job"),interview_time:v("msg_time"),location:v("msg_loc")})});
    r.id=cid; state.commDraft=r; paintTalent();
  }catch(e){ var box=document.getElementById("msg_res"); if(box) box.innerHTML='<div class="err" style="padding:8px 12px;border-radius:8px">'+esc(e.message)+'</div>'; }
}
async function runInterviewQuestions(cid){
  var jd = state.jdJobId ? ((jobById(state.jdJobId)||{}).jd_text||"") : ((document.getElementById("jd_text")||{}).value||"").trim();
  try{
    var r=await api("/api/talent/"+cid+"/interview-questions",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({jd:jd,gap_items:(state.jdGap&&state.jdGap.id===cid)?state.jdGap.items:[]})});
    state.interviewQs={id:cid,questions:r.questions||[]}; paintTalent();
  }catch(e){ var box=document.getElementById("iq_res"); if(box) box.innerHTML='<div class="err" style="padding:8px 12px;border-radius:8px">'+esc(e.message)+'</div>'; }
}

/* ---------- 检索 ---------- */
function renderSearch(c){
  c.className="content"; c.style.overflow="auto"; c.innerHTML='<div class="pad"><div class="searchbar"><input id="sQ" placeholder="输入关键词,如「报销」「年假」「备份」" /><button class="btn btn-primary" id="sBtn" style="padding:10px 20px">'+S(IC.search,15)+' 搜索</button></div><div id="sRes"></div></div>';
  var inp=document.getElementById("sQ"); if(state.search) inp.value=state.search.term;
  inp.onkeydown=function(e){ if(e.key==="Enter") runSearch(); };
  document.getElementById("sBtn").onclick=runSearch;
  renderSearchResults();
}
function renderSearchResults(){
  var box=document.getElementById("sRes"); if(!box) return;
  if(!state.search){ box.innerHTML=""; return; }
  var term=state.search.term, hits=state.search.hits;
  var list = hits.length ? hits.map(function(c){
    var t=c.text, idx=t.toLowerCase().indexOf(term.toLowerCase());
    var inner = idx<0 ? esc(t) : esc(t.slice(0,idx))+'<mark>'+esc(t.slice(idx,idx+term.length))+'</mark>'+esc(t.slice(idx+term.length));
    return '<div class="hit"><div class="h"><span style="color:var(--teal)">'+S(IC.book,13)+'</span> 《'+esc(c.doc_title)+'》 <span class="tag">'+esc(c.dept)+'</span></div><div style="font-size:14px;line-height:1.6">'+inner+'</div></div>';
  }).join("") : '<div class="empty-box">没有命中,换个关键词试试。</div>';
  box.innerHTML='<div style="font-size:12px;color:var(--slate);margin-bottom:12px">「'+esc(term)+'」共命中 '+hits.length+' 段</div>'+list;
}
async function runSearch(){
  var term=document.getElementById("sQ").value.trim(); if(!term){ state.search=null; renderSearchResults(); return; }
  try{ var r=await api("/api/search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({q:term})}); state.search={term:term,hits:r.hits}; renderSearchResults(); }
  catch(e){ state.err="检索失败:"+e.message; renderShell(); }
}

/* ---------- 用户管理 ---------- */
async function renderUsers(c){
  c.className="content"; c.innerHTML='<div class="pad"><div class="muted">加载中…</div></div>';
  try{ state.users=await api("/api/users"); }catch(e){ c.innerHTML='<div class="pad"><div class="err">'+esc(e.message)+'</div></div>'; return; }
  var u=state.users, full=u.used>=u.seats;
  var rows=u.users.map(function(x){
    var del = x.username===state.user.username ? '<span style="color:var(--slate);font-size:12px">当前账号</span>' : '<button class="iconbtn" data-deluser="'+esc(x.username)+'">'+S(IC.trash,14)+'</button>';
    return '<tr><td>'+esc(x.username)+'</td><td><span class="tag">'+esc(u.role_names[x.role]||x.role)+'</span></td><td style="text-align:right">'+del+'</td></tr>';
  }).join("");
  var roleOpts=Object.keys(u.role_names).map(function(k){ return '<option value="'+k+'">'+esc(u.role_names[k])+'</option>'; }).join("");
  c.innerHTML='<div class="pad"><div class="grid2">'
    +'<div><div class="sectitle" style="margin-bottom:12px">账号(席位 '+u.used+' / '+u.seats+')</div>'
    +'<table class="ut"><thead><tr><th>用户名</th><th>角色</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'
    +'<div><div class="sectitle" style="margin-bottom:12px">新增账号</div><div class="form">'
    +(full?'<div style="font-size:12px;color:#A23B3B">已达授权席位上限('+u.seats+'),需升级授权才能新增。</div>':'')
    +'<input id="nu" placeholder="用户名" /><input id="np" type="password" placeholder="密码" />'
    +'<select id="nr">'+roleOpts+'</select>'
    +'<button class="btn btn-primary" id="nadd"'+(full?' disabled':'')+'>'+S(IC.plus,15)+' 创建账号</button>'
    +'<div style="font-size:11px;color:var(--slate)">不同角色可见的知识范围不同(企业版按部门隔离)。</div>'
    +'</div></div>'
    +'</div></div>';
  c.querySelectorAll("[data-deluser]").forEach(function(b){ b.onclick=function(){ delUser(b.getAttribute("data-deluser")); }; });
  var addBtn=document.getElementById("nadd"); if(addBtn) addBtn.onclick=addUser;
}
async function addUser(){
  var un=document.getElementById("nu").value.trim(), pw=document.getElementById("np").value, ro=document.getElementById("nr").value;
  if(!un||!pw){ state.err="用户名和密码不能为空"; renderShell(); return; }
  try{ await api("/api/users",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:un,password:pw,role:ro})}); state.err=""; var m=await api("/api/me"); state.license=m.license; renderShell(); }
  catch(e){ state.err="创建失败:"+e.message; renderShell(); }
}
async function delUser(un){
  try{ await api("/api/users/"+encodeURIComponent(un),{method:"DELETE"}); var m=await api("/api/me"); state.license=m.license; renderShell(); }
  catch(e){ state.err=e.message; renderShell(); }
}

/* ---------- 数据分析 ---------- */
async function renderAnalytics(c){
  c.className="content"; c.innerHTML='<div class="pad"><div class="muted">加载中…</div></div>';
  try{ state.analytics=await api("/api/analytics"); }catch(e){ c.innerHTML='<div class="pad"><div class="err">'+esc(e.message)+'</div></div>'; return; }
  var a=state.analytics;
  var cards=[["总提问数",a.total,IC.chat],["拒答率",(a.refused_rate*100).toFixed(1)+"%",IC.shield],["👍 赞",a.up,IC.spark],["👎 踩",a.down,IC.spark]];
  var max=Math.max(1,Math.max.apply(null,a.by_day.map(function(d){return d.count;})));
  var bars=a.by_day.map(function(d){ return '<div class="bar-col"><div class="bar" style="height:'+(d.count/max*100)+'%" title="'+d.date+': '+d.count+'"></div><div class="bar-x">'+d.date.slice(5)+'</div></div>'; }).join("");
  var recent = a.recent.length ? a.recent.map(function(r){
    return '<tr><td>'+esc(r.question_preview||"已隐藏")+'</td><td><span class="tag">'+esc(state.roleNames[r.role]||r.role)+'</span></td><td>'+(r.refused?'<span class="tag red">拒答</span>':(r.rating===1?'👍':(r.rating===-1?'👎':'—')))+'</td></tr>';
  }).join("") : '<tr><td colspan="3" style="color:var(--slate)">暂无问答记录</td></tr>';
  c.innerHTML='<div class="pad">'
    +'<div class="grid4">'+cards.map(function(s){ return '<div class="card stat"><div class="l">'+S(s[2],14)+' '+s[0]+'</div><div class="v" style="font-size:26px">'+esc(s[1])+'</div></div>'; }).join("")+'</div>'
    +'<div class="card" style="margin-bottom:20px"><div class="sectitle" style="margin-bottom:6px">近 14 天提问量</div><div class="barchart">'+bars+'</div></div>'
    +'<div class="sectitle" style="margin-bottom:12px">最近问答</div><table class="ut"><thead><tr><th>问题预览</th><th>提问角色</th><th>结果</th></tr></thead><tbody>'+recent+'</tbody></table>'
    +'</div>';
}
