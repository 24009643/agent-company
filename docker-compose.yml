services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Ollama 跑在宿主机(直接用 GPU)
      OLLAMA_URL: http://host.docker.internal:11434
      LLM_MODEL: qwen2.5:7b
      EMBED_MODEL: bge-m3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/data:/app/backend/data
