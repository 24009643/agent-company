# 财务域 —— 风险档判据:答错一个数字,用户会依据它做出有金钱/合规后果的行为 → 高风险
id: finance
name: 财务
risk_tier: high
# 该域的受限部门:无权看此部门的用户不得被路由进本域(否则工具/政策数据成为绕过权限咽喉的后门)。
# admin(depts=None,全部可见)不受限。见 driver.route 的权限回退。
dept: 财务
# 路由:问题含任一关键词 → 本域闸门参数生效(注意:路由只选配置,绝不改变可见部门/权限)
match_keywords: [报销, 差旅, 发票, 餐补, 住宿, 出差, 打款, 借款, 付款, 超标, 酒店, 房费, 能报, 报多少]
min_score: 0.60
boundary_min: 0.60
boundary_answer: false  # 高风险域关闭边界答:边缘证据一律拒答(宁拒不错),金额/日期不允许推断
extra_stopwords: []     # 财务短词(发票/报销/餐补)信息量高,不吸收
allowed_powers: [L1, L2, L3, L6]  # L2 工具算账 + L6 数字机械核对(步骤 10 上线,2026-07-02)
