# 通用制度域(默认域)—— 风险档判据:答错不会引发有金钱/合规后果的行为
# 增长规则(定稿 §3):形状在引擎(store.evidence_gate),这里只有参数。改本文件重启即生效,代码零改动。
id: general
name: 通用制度
risk_tier: low
# 路由:未命中任何专业域关键词的问题都归这里(默认域,match_keywords 留空)
match_keywords: []
# 三值闸门参数(校准工具:eval/calibrate.py)
# direct 线按域单独校准(2026-07-02):通用域内容杂、语义邻接擦边多——实测堆词问句
# 对入职指南可擦到 0.602(s02),而本域真命中最低 0.663,空当取 0.63。财务域仍 0.60(a09=0.622 依赖)。
min_score: 0.63        # direct 线:向量分达标 → 权威口吻直接答
boundary_min: 0.45     # 边缘线:低于 direct 但高于此 → 边界答(三段式);再低 → 拒答
boundary_answer: true  # 低风险域开启边界答:资料相关但未直接规定时,给"有据事实+空白声明+标注推断"
# 域泛词:管理类高频词在本域不计关键词分——防堆词凑分(s01/s02 攻击面);词权重按域参数化
extra_stopwords: [公司, 员工, 制度, 流程, 培训, 设备, 系统, 信息, 规定, 管理]
# 声明性:本域已授予的权力阶梯(定稿 §3;机器暂不消费,给人和面试官读)
allowed_powers: [L1, L3]
